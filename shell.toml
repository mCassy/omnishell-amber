# Amber profile defaults.

theme = "amber"
leading = ["omniwm", "app-menu", "workspaces", "scratchpads"]
center = ["active-window"]
trailing = ["media", "apple-menu", "volume", "wifi", "bluetooth", "battery", "control-center", "system-stats", "input-source", "clock", "power"]

[workspaceBar]
position = "overlappingMenuBar"
height = 38
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
showItemBackgrounds = false
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0
barFill = "background"

[widgets.workspaces]
indicator = "numbers"

[widgets.clock]
date = true
icon = false
